; PlatformIO Configuration File
;
; Build options:
;   -D OTAA_SERVER_URL=\"http://your-server.com\"
;   -D OTAA_DEVICE_ID=\"your-device-id\"
;   -D OTAA_DEVICE_TOKEN=\"your-device-token\"
;   -D FIRMWARE_VERSION=\"1.0.0\"
;

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^6.21.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -D FIRMWARE_VERSION=\"1.0.0\"
    -D OTAA_SERVER_URL=\"http://118.145.100.70\"

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -D FIRMWARE_VERSION=\"1.0.0\"
    -D OTAA_SERVER_URL=\"http://118.145.100.70\"

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
build_flags =
    -D FIRMWARE_VERSION=\"1.0.0\"
    -D OTAA_SERVER_URL=\"http://118.145.100.70\"
lib_deps =
    bblanchon/ArduinoJson@^6.21.0
